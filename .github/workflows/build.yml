name: Build Docker Image

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and Export Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker buildx build --load --tag ruixing-taxpro-site:latest .

      - name: Export Docker Image Artifact
        run: |
          mkdir -p dist
          docker save ruixing-taxpro-site:latest -o dist/ruixing-taxpro-site.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: dist/ruixing-taxpro-site.tar
          retention-days: 7
