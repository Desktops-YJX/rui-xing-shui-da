name: Deploy Docker Container

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Deploy to Debian Server
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
    steps:
      - name: Download Docker Image Artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          branch: main
          workflow_conclusion: success
          name: docker-image
          path: ./docker-image

      - name: Prepare Server Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu

            APP_DIR="${{ secrets.DEPLOY_PATH }}"

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            else
              SUDO="sudo"
            fi

            if ! command -v rsync >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y rsync
            fi

            $SUDO mkdir -p "$APP_DIR/artifacts"
            $SUDO chown -R "$(id -un)":"$(id -gn)" "$APP_DIR"

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload Image to Server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e rsync -v --progress -e "ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -p ${{ secrets.SERVER_PORT }}" docker-image/ruixing-taxpro-site.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_PATH }}/artifacts/

      - name: Create .env File
        if: ${{ env.APP_ENV_FILE != '' }}
        run: |
          cat <<'EOF' > .deploy.env
          ${{ env.APP_ENV_FILE }}
          EOF

      - name: Upload .env to Server
        if: ${{ env.APP_ENV_FILE != '' }}
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT }} .deploy.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_PATH }}/.env

      - name: Load Image and Restart Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            ARTIFACT_DIR="$APP_DIR/artifacts"
            IMAGE_TAR="$ARTIFACT_DIR/ruixing-taxpro-site.tar.gz"
            IMAGE_NAME="ruixing-taxpro-site:latest"
            CONTAINER_NAME="ruixing-taxpro-site"
            HOST_PORT="3001"
            CONTAINER_PORT="3001"
            ENV_FILE="$APP_DIR/.env"

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            else
              SUDO="sudo"
            fi

            mkdir -p "$ARTIFACT_DIR"

            if ! command -v docker >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y ca-certificates curl gnupg
              $SUDO install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/debian/gpg | $SUDO gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              $SUDO chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                | $SUDO tee /etc/apt/sources.list.d/docker.list >/dev/null
              $SUDO apt-get update
              $SUDO apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            $SUDO systemctl enable --now docker
            $SUDO docker load -i "$IMAGE_TAR"

            for name in "ruixing-taxpro-site" "rui_xing"; do
              if $SUDO docker ps -a --format '{{.Names}}' | grep -Fxq "$name"; then
                $SUDO docker rm -f "$name"
              fi
            done

            RUN_ARGS="--detach --restart unless-stopped --name $CONTAINER_NAME -p ${HOST_PORT}:${CONTAINER_PORT}"
            if [ -f "$ENV_FILE" ]; then
              RUN_ARGS="$RUN_ARGS --env-file $ENV_FILE"
            fi

            $SUDO docker run $RUN_ARGS "$IMAGE_NAME"
            rm -f "$IMAGE_TAR"
